version: '3.8'

# Surcharge développement — hot reload activé, ports exposés
# Usage : docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:4000
    ports:
      - "5173:5173"
    command: pnpm dev --host 0.0.0.0

  backend:
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    ports:
      - "4000:4000"
    command: npm run dev

  db-master:
    ports:
      - "5432:5432"

  nginx:
    ports:
      - "8080:80"
