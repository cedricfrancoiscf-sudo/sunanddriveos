version: '3.8'

# Infrastructure SunanddriveOS — NAS Synology DS224+ DSM 7.2.2
# Déploiement : /volume1/docker/sunanddriveos

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sunanddriveos-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - sunanddriveos-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sunanddriveos-backend
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db-master:
        condition: service_healthy
    networks:
      - sunanddriveos-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db-master:
    image: postgres:16-alpine
    container_name: sunanddriveos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sunanddriveos_master
      POSTGRES_USER: sunanddriveos
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/prisma/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - sunanddriveos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunanddriveos -d sunanddriveos_master"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: sunanddriveos-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8445:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sunanddriveos-net

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - sunanddriveos-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - sunanddriveos-net

volumes:
  postgres_data:
  portainer_data:

networks:
  sunanddriveos-net:
    driver: bridge
